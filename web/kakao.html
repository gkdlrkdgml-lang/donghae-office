<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>카카오 알림 연결</title>
<style>body{font-family:system-ui,'Pretendard',sans-serif;max-width:560px;margin:40px auto;padding:0 18px;color:#1B3A6B}h1{font-size:22px}#c{font:700 16px monospace;word-break:break-all;background:#F3F6FB;border:1px solid #CBD6E6;border-radius:10px;padding:14px;margin:12px 0}button{font:700 16px system-ui;background:#FEE500;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}p{line-height:1.6}</style></head>
<body><div id="start" style="display:none"><h1>카카오 알림 연결 · 1단계</h1><p>카카오 콘솔 <b>[앱] → [플랫폼 키] → REST API 키</b>의 키 값을 아래 칸에 붙여 넣고 <b>카카오로 동의하기</b>를 누르세요. (키는 어디에도 저장되지 않습니다)</p>
<input id="k" placeholder="REST API 키 붙여 넣기" style="width:100%;box-sizing:border-box;font:16px monospace;padding:12px;border:1px solid #CBD6E6;border-radius:10px;margin:8px 0 12px"><button id="go">카카오로 동의하기</button></div>
<div id="got"><h1>카카오 알림 연결 · 인증 코드</h1><div id="c">코드 없음</div><button id="b">코드 복사</button>
<p>이 코드를 GitHub의 「카카오 알림 연결」 실행 화면 <b>code</b> 칸에 붙여 넣고 실행하세요. 코드는 10분 안에 한 번만 쓸 수 있습니다.</p></div>
<script>var q=new URLSearchParams(location.search);
if(!q.get('code')&&!q.get('error')){document.getElementById('start').style.display='';document.getElementById('got').style.display='none';
document.getElementById('go').onclick=function(){var k=document.getElementById('k').value.trim();if(!k){alert('키를 넣어 주세요');return}
location.href='https://kauth.kakao.com/oauth/authorize?response_type=code&scope=talk_message&redirect_uri='+encodeURIComponent(location.origin+location.pathname)+'&client_id='+encodeURIComponent(k)}}
var c=q.get('code')||('오류: '+(q.get('error_description')||q.get('error')||'코드 없음'));document.getElementById('c').textContent=c;
document.getElementById('b').onclick=function(){navigator.clipboard.writeText(c).then(function(){document.getElementById('b').textContent='복사됨 ✓'})};
history.replaceState(null,'',location.pathname);</script></body></html>
