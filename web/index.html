<body>
<div id="stage">
  <header>
    <div class="brand"><a href="admin.html" class="emblink" aria-label="관리자" tabindex="-1"><img class="emblem" src="img/emblem.png" alt="동해시 상징마크"></a><span id="appTitle" title="새로 고침" style="cursor:pointer" onclick="location.reload()">동해시 AI 시장실</span><span id="appSlogan" class="slogan"></span></div>
    <nav id="nav" aria-label="화면 메뉴"></nav>
    <div class="hright"><span id="badges"></span><button id="instBtn" type="button" title="바탕화면·홈 화면에 앱처럼 설치" onclick="window.DHInstall && DHInstall.open()">📲 앱 설치</button><button id="flowBtn" type="button" title="여러 화면을 정해진 간격으로 돌려 보기" onclick="location.hash='flow'">▶ 흘러가기</button><button id="printBtn" type="button" title="지금 화면 인쇄(PDF 저장 가능)" onclick="dhPrint()" aria-label="인쇄">🖨</button><span id="updated"></span><span id="clock"></span></div>
  </header>
  <main id="view"></main>
</div>
<script>
  // 지금 보이는 탭(아래 탭·크게 보기 포함)을 A4 가로 1장으로 인쇄 — 파일 이름은 탭 이름·날짜
  function dhPrint() {
    var t0 = document.title, on = document.querySelector('nav button[aria-current="page"]'), sub = document.querySelector('.subtabs button.on, .subtabs button[aria-current], .subtabs button.active');
    var d = new Date(), ymd = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    document.title = '동해시 AI 시장실 ' + (on ? on.textContent.replace(/^\d+\s*/, '') : '') + (sub ? ' ' + sub.textContent.trim() : '') + ' ' + ymd;
    var back = function () { document.title = t0; window.removeEventListener('afterprint', back); };
    window.addEventListener('afterprint', back);
    window.print();
  }
function startApp() {
  'use strict';
  var D = window.DONGHAE_DATA;
  var stage = document.getElementById('stage');
  var view = document.getElementById('view');

  // ---------- 화면 크기에 맞춰 1920×1080을 늘리거나 줄임 ----------
  // 휴대폰: 주소창이 생기고 사라질 때·가로로 돌릴 때도 실제 보이는 크기(visualViewport)에 딱 맞춤
  function fit() {
    // 화면 틀 크기(손가락 확대와 상관없는 값)로 맞춤
    var W = document.documentElement.clientWidth || window.innerWidth, H = document.documentElement.clientHeight || window.innerHeight;
    var s = Math.min(W / 1920, H / 1080);
    stage.style.transform = 'translate(' + (W - 1920 * s) / 2 + 'px,' + (H - 1080 * s) / 2 + 'px) scale(' + s + ')';
    var tip = document.getElementById('rotTip');
    if (tip) tip.style.display = (H > W * 1.1 && W < 900 && !tipOff) ? 'flex' : 'none';
  }
  var tipOff = false;
  window.addEventListener('resize', fit);
  // 처음 열 때·돌릴 때는 손가락 확대를 풀고(브라우저가 기억한 확대 포함) 화면에 맞춤
  function resetZoom() {
    var m = document.querySelector('meta[name=viewport]'); if (!m) return;
    var c = m.getAttribute('content');
    m.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
    setTimeout(function () { m.setAttribute('content', c); fit(); }, 350);
  }
  window.addEventListener('orientationchange', function () { resetZoom(); fit(); setTimeout(fit, 250); setTimeout(fit, 700); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { if (window.visualViewport.scale <= 1.01) fit(); });
  if (window.visualViewport && window.visualViewport.scale > 1.01) resetZoom();
  // 세로로 들고 있으면 「가로로 돌려 주세요」(누르면 전체 화면 + 가로 고정 — 안드로이드)
  (function () {
    var tip = document.createElement('div'); tip.id = 'rotTip';
    tip.innerHTML = '<div class="rbox"><div class="ricon">📱↻</div><b>휴대폰을 가로로 돌려 주세요</b><span>화면이 자동으로 꽉 차게 맞춰집니다</span>'
      + '<button type="button" id="rotFs">가로 전체 화면으로 보기</button><a href="#" id="rotNo">세로로 그냥 보기</a></div>';
    document.body.appendChild(tip);
    document.getElementById('rotFs').onclick = function () {
      var el2 = document.documentElement, rq = el2.requestFullscreen || el2.webkitRequestFullscreen;
      try { var p = rq && rq.call(el2, { navigationUI: 'hide' }); if (p && p.then) p.then(function () { try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) { /* 아이폰 */ } }).catch(function () {}); } catch (e) { /* 지원 안 함 */ }
    };
    document.getElementById('rotNo').onclick = function (e) { e.preventDefault(); tipOff = true; fit(); };
  })();
  fit();

  // ---------- 작은 도우미 ----------
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'style') e.style.cssText = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function fmt(v, d) { return v == null ? '–' : Number(v).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function judgeLabel(j) { return { strong: '강점', weak: '개선 필요', middle: '중간', excluded: '판정 제외' }[j] || ''; }
  function judgeColor(j) { return { strong: '#2E9C6A', weak: '#D9443F', middle: '#F2B51C', excluded: '#B3BDCB' }[j] || '#F2B51C'; }   // 초록 좋음 · 노랑 보통 · 빨강 개선 필요
  function ind(id) { return (D.indicators || []).filter(function (i) { return i.id === id; })[0]; }
  function ymLabel(ym) { return ym ? ym.slice(0, 4) + '년 ' + Number(ym.slice(4)) + '월' : ''; }

  if (!D) {
    setTimeout(function () { try { sessionStorage.setItem('dh_auto_reload', '1'); } catch (e) { /* 무시 */ } location.reload(); }, 30 * 60 * 1000);
    view.appendChild(el('div', { class: 'empty', style: 'font-size:28px;padding:80px', text: '데이터 파일을 받지 못했습니다. 인터넷 연결을 확인해 주세요. 30분 뒤 자동으로 다시 시도합니다.' }));
    return;
  }

  document.getElementById('appTitle').textContent = D.title;
  document.getElementById('appSlogan').textContent = D.slogan || '';
  var badges = document.getElementById('badges');
  if (D.demo) badges.appendChild(el('span', { class: 'badge demo', text: '시연용 가짜 값' }));
  var gen = new Date(D.generated_at.replace(' ', 'T') + ':00+09:00');
  if ((Date.now() - gen.getTime()) > 36 * 3600 * 1000) badges.appendChild(el('span', { class: 'badge late', text: '갱신 지연' }));
  document.getElementById('updated').innerHTML = '최종 갱신<br>' + D.generated_at;

  // ---------- 메뉴 ----------
  var nav = document.getElementById('nav');
  var order = D.menu.map(function (m) { return m.id; });
  var current = (location.hash || '#' + order[0]).slice(1);
  if (order.indexOf(current) < 0) current = order[0];
  D.menu.filter(function (m) { return m.id !== 'flow' && !m.more; }).forEach(function (m, i) {
    nav.appendChild(el('button', { type: 'button', 'data-id': m.id, text: (i + 1) + ' ' + m.label, onclick: function () { go(m.id); } }));
  });
  if (D.menu.some(function (m) { return m.more; })) nav.appendChild(el('span', { id: 'moreWrap' }, [el('button', { type: 'button', id: 'moreBtn', title: '다른 화면', text: '더보기 ▾', onclick: function (ev) { window.dhMore(ev); } })]));
  try { if (window.DHInstall && DHInstall.installed()) document.getElementById('instBtn').style.display = 'none'; } catch (e) { /* 무시 */ }
  // ---------- 더보기: 덜 쓰는 탭(menu.more)은 맨 윗줄 「더보기 ▾」 목록에서 ----------
  window.dhMore = function (ev) {
    if (ev) ev.stopPropagation();

  function fitRows() {
    Array.prototype.forEach.call(view.querySelectorAll('section'), function (sec) {
      if (sec.classList.contains('zoom') || sec.classList.contains('detail') || sec.classList.contains('nozoom')) return;

      limit -= 24;                                     // 안내 줄 자리
      var vis = [];
      Array.prototype.forEach.call(rows, function (r) { if (r.getBoundingClientRect().bottom > limit) { r.style.display = 'none'; hid++; } else vis.push(r); });
      if (!hid) return;
      // 동해 줄이 잘렸으면 마지막 보이는 줄 대신 동해 줄을 보여 줌

      if (meRow && vis.length > 1) { vis[vis.length - 1].style.display = 'none'; meRow.style.display = ''; }
