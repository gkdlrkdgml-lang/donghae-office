<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>동해시 AI 시장실</title>
<link rel="icon" href="img/emblem.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #F4F6F9; --panel: #FFFFFF; --line: #DCE2EA; --ink: #17202C; --sub: #556274; --mute: #8693A4;
    --blue: #1F6FD1; --navy: #1B3A6B; --blue2: #6B8FBF; --good: #1B7A4B; --goodbg: #E2F3E9; --warn: #8A5300; --warnbg: #FFF1D9;
    --bad: #B42318; --badbg: #FDE7E4; --me: #E4EEFB; --track: #EDF1F6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #E9EDF2; overflow: hidden; }
  body { font-family: 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg);
           display: grid; grid-template-rows: 64px minmax(0, 1fr); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #FFFFFF; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: var(--navy); }
  .brand .slogan { font-size: 15px; font-weight: 600; color: var(--blue); padding-left: 14px; margin-left: 2px; border-left: 2px solid var(--line); }
  .brand .emblem { height: 34px; width: auto; display: block; }
  .brand i { width: 38px; height: 38px; border-radius: 8px; background: var(--blue); display: inline-block; }
  nav { display: flex; gap: 4px; }
  nav button { font: inherit; font-size: 16px; color: var(--sub); background: none; border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; min-height: 40px; }
  nav button[aria-current="page"] { background: var(--blue); color: #fff; font-weight: 700; }
  .hright { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--sub); }
  .badge { padding: 5px 10px; border-radius: 999px; font-size: 13px; }
  .badge.demo { background: var(--warnbg); color: var(--warn); border: 1px solid #F0C98A; }
  .badge.late { background: var(--badbg); color: var(--bad); border: 1px solid #F2B3AC; }
  #clock { font-size: 18px; color: var(--navy); font-weight: 700; }
  main { padding: 24px 28px 20px; min-height: 0; display: grid; gap: 16px; }
  .title { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .title h1 { margin: 0; font-size: 28px; color: var(--navy); }
  .title span { font-size: 14px; color: var(--sub); }
  section { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(20,30,50,.05); border-radius: 12px; padding: 16px 20px; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  section h2 { margin: 0; font-size: 20px; color: var(--navy); }
  .sh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sh small { font-size: 13px; color: var(--sub); }
  .kpis { grid-column: 1 / -1; display: grid; gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(20,30,50,.06); border-radius: 12px; padding: 14px 18px 14px 22px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; overflow: hidden; }
  .kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--blue); }
  .kpi.t-good::before { background: #2E9C6A; } .kpi.t-bad::before { background: #D9822B; } .kpi.t-mute::before { background: #B3BDCB; }
  .kpi .l { font-size: 16px; font-weight: 700; color: var(--ink); }
  .kpi .l small { font-size: 13px; font-weight: 500; color: var(--sub); margin-left: 6px; }
  .kpi .v { font-size: 34px; font-weight: 700; color: var(--navy); }
  .kpis.big .kpi .v { font-size: 44px; line-height: 1.05; letter-spacing: -0.5px; }
  .kpi.t-bad .v.tint { color: #B4531B; } .kpi.t-good .v.tint { color: #1B7A4B; }
  .kpi .v small { font-size: 18px; color: var(--sub); font-weight: 500; margin-left: 4px; }
  .sh { position: relative; }
  .zbtn { font: inherit; font-size: 13px; font-weight: 600; color: var(--blue); background: #EEF4FC; border: 1px solid #CFE0F6; border-radius: 999px; padding: 3px 10px; cursor: pointer; margin-left: 10px; white-space: nowrap; }
  .zbtn:hover { background: var(--blue); color: #fff; }
  section.zoom { position: fixed; left: 48px; right: 48px; top: 84px; bottom: 40px; z-index: 60; box-shadow: 0 20px 60px rgba(15,30,60,.35); }
  section.zoom > * { zoom: 1.45; }
  section.zoom .zbtn { background: var(--blue); color: #fff; }
  #zoomBack { position: fixed; inset: 0; background: rgba(23,32,44,.45); z-index: 50; }
  .donut { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 12px; min-height: 0; }
  .dsvg { min-height: 0; display: flex; justify-content: center; }
  .legend { display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
  .legend div { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; }
  .legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .kpi.click { cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .kpi.click:hover { box-shadow: 0 6px 18px rgba(31,111,209,.18); transform: translateY(-1px); }
  .kpi .more { position: absolute; right: 14px; top: 12px; font-size: 14px; font-weight: 800; color: #fff; background: #D9822B; border-radius: 999px; padding: 4px 12px; box-shadow: 0 2px 6px rgba(217,130,43,.35); animation: pulse 2.4s ease-in-out infinite; }
  .kpi.click { border: 2px solid #F2C79A; background: linear-gradient(180deg, #FFFFFF 60%, #FFF6EC 100%); }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  #detailBack { position: fixed; inset: 0; background: rgba(23,32,44,.45); z-index: 50; }
  section.detail { position: fixed; left: 80px; right: 80px; top: 100px; bottom: 60px; z-index: 60; box-shadow: 0 20px 60px rgba(15,30,60,.35); display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .detailBody { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr); gap: 28px; min-height: 0; align-items: start; }
  .detailBody .donut { grid-template-columns: 1fr; }
  .detailBody .donut svg { max-height: 360px !important; }
  table.dt.big td, table.dt.big th { font-size: 16px; padding: 7px 8px; }
  table.dt tr.me td { background: #E4EEFB; color: #1B3A6B; font-weight: 700; }
  table.dt tr.pk td { background: #FFF1E2; font-weight: 700; }

  .basis { background: var(--navy); color: #fff !important; border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 15px !important; }
  .popL { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 14px; min-height: 0; }
  .pr1 { display: grid; grid-template-columns: 1.35fr repeat(4, minmax(0, 1fr)); gap: 12px; }
  .pc { background: #fff; border: 1.5px solid #C9D8EE; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
  .pc .pl { font-size: 19px; font-weight: 800; color: var(--ink); }
  .pc .pl small { font-size: 14px; font-weight: 600; color: var(--sub); }
  .pc .pv { font-size: 36px; font-weight: 800; line-height: 1.05; letter-spacing: -0.5px; }
  .pc .pv small { font-size: 18px; font-weight: 700; margin-left: 2px; }
  .pc .pd { display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 600; color: var(--ink); border: 1.5px solid #C9D8EE; border-radius: 999px; padding: 3px 14px; }
  .pc .ps { font-size: 13.5px; color: var(--sub); }
  .pc.hero { background: var(--navy); border-color: var(--navy); color: #fff; justify-content: center; gap: 10px; }
  .pc.hero .pl { color: #fff; font-size: 22px; } .pc.hero .pv { color: #fff; font-size: 58px; } .pc.hero .ps { color: #C9D6EA; }
  .pc.hero .pd { background: #fff; border-color: #fff; font-size: 17px; }
  .ico { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .ico svg { width: 58%; height: 58%; }
  .dl { font-weight: 800; color: var(--sub); } .dl.up { color: #D03B2F; } .dl.down { color: #2F5FC4; }
  .pr2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pc.wide { flex-direction: row; text-align: left; gap: 22px; padding: 14px 24px; align-items: center; }
  .pc.wide .wrow { display: flex; align-items: center; gap: 18px; margin: 4px 0; }
  .pc.wide .pv { font-size: 46px; }
  .mig { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; padding: 0 0 14px; overflow: hidden; border: 1.5px solid #C9D8EE; }
  .band { background: var(--navy); color: #fff; font-weight: 800; font-size: 18px; text-align: center; padding: 9px; margin: 0; border-radius: 12px 12px 0 0; }
  .mrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0 14px; }
  .mc { display: flex; flex-direction: column; align-items: center; gap: 4px; border-right: 1px solid #DCE5F2; padding: 0 6px; }
  .mc:last-child { border-right: 0; }
  .mc .pl { font-size: 19px; font-weight: 800; } .mc .msub { font-size: 13px; color: var(--sub); margin-top: -4px; }
  .mc .pv { font-size: 32px; font-weight: 800; } .mc .pv small { font-size: 16px; }
  .mc .pd { display: flex; gap: 8px; font-size: 14.5px; font-weight: 600; }
  .od { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 4px 18px 0; min-height: 0; border-top: 1px solid #DCE5F2; }
  .odl { display: flex; flex-direction: column; gap: 5px; padding-top: 8px; }
  .odh { font-size: 15.5px; font-weight: 800; color: var(--navy); margin-bottom: 2px; }
  .odr { display: grid; grid-template-columns: 112px minmax(0, 1fr) 42px; gap: 8px; align-items: center; font-size: 14.5px; }
  .odn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .odb { height: 12px; background: var(--track); border-radius: 6px; overflow: hidden; } .odb i { display: block; height: 100%; border-radius: 6px; }
  .odr b { text-align: right; }
  section.dongs { padding: 0; display: flex; flex-direction: column; border: 1.5px solid #C9D8EE; border-radius: 16px; }
  .dl10 { display: flex; flex-direction: column; padding: 6px 20px; }
  .dr { display: grid; grid-template-columns: 74px 1fr 92px; grid-template-rows: auto auto; align-items: center; column-gap: 8px; padding: 9px 0; border-bottom: 1px solid #EDF1F6; }
  .dr b { font-size: 19px; } .dr .dn { font-size: 20px; font-weight: 800; text-align: right; color: var(--navy); }
  .dr .dl { text-align: right; font-size: 16px; } .dr .de { grid-column: 2 / 4; text-align: right; font-size: 12.5px; color: var(--sub); }
  section.dongs .note { margin: 10px 16px 14px; }
  .subtabs { display: flex; gap: 6px; margin-left: 18px; margin-right: auto; }
  .subtabs button { font: inherit; font-size: 16px; font-weight: 700; padding: 6px 16px; border-radius: 999px; border: 1.5px solid #C9D8EE; background: #fff; color: var(--sub); cursor: pointer; }
  .subtabs button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .pc.click, section.click { position: relative; cursor: pointer; }
  .pc .more { position: absolute; right: 10px; top: 10px; font-size: 12.5px; font-weight: 800; color: #fff; background: #D9822B; border-radius: 999px; padding: 3px 10px; box-shadow: 0 2px 6px rgba(217,130,43,.35); animation: pulse 2.4s ease-in-out infinite; }
  .pr1 .pc .more { top: auto; bottom: 8px; right: 8px; }
  .band { position: relative; }
  .more.inband { position: absolute; right: 12px; top: 50%; margin-top: -13px; font-size: 13px; font-weight: 800; color: #fff; background: #D9822B; border-radius: 999px; padding: 3px 12px; animation: pulse 2.4s ease-in-out infinite; }
  .pc.click:hover, section.click:hover { box-shadow: 0 6px 18px rgba(31,111,209,.18); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #EEF2F7; color: #3D4B5E; white-space: nowrap; }
  .chip.bad { background: #FDEBDD; color: #A4470F; } .chip.good { background: #E2F3E9; color: #1B7A4B; } .chip.navy { background: #E4EEFB; color: #1B3A6B; } .chip.violet { background: #EFE9FB; color: #5B3FA0; }
  .kpi .n { font-size: 13.5px; color: var(--sub); }
  .rows { display: flex; flex-direction: column; justify-content: space-between; flex: 1 1 auto; min-height: 0; }
  .row { display: grid; grid-template-columns: 28px 56px minmax(0, 1fr) 72px; gap: 10px; align-items: center; font-size: 16px; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
  .row.me { background: var(--me); font-weight: 700; color: var(--navy); }
  .row.sel { outline: 2px solid var(--blue); }
  .row .rk { color: var(--sub); text-align: right; font-weight: 400; }
  .row .v { text-align: right; }
  .bar { height: 14px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; }
  .tag.strong { background: var(--goodbg); color: var(--good); }
  .tag.weak { background: var(--badbg); color: var(--bad); }
  .tag.middle { background: #EAF0F8; color: #3D5677; }
  .tag.excluded { background: #EFF1F4; color: var(--mute); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: #F6F8FB; border: 1px solid #E6EBF1; border-radius: 8px; padding: 12px 14px; font-size: 16px; }
  .item b { font-size: 18px; }
  .empty { color: var(--mute); font-size: 15px; padding: 8px 2px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; min-height: 0; }
  .two .cap { font-size: 14px; font-weight: 700; color: var(--navy); margin: 2px 0 6px; }
  table.dt td, table.dt th { font-size: 14.5px; padding: 6px 4px; }
  .note { background: #FFF8EC; border: 1px solid #F1D9AE; border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.55; color: #3C4656; }
  .note b { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-size: 15.5px; }
  th { text-align: left; color: var(--sub); font-weight: 400; font-size: 13.5px; padding: 6px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 6px; border-bottom: 1px solid #EDF1F6; }
  td.r, th.r { text-align: right; }
  .cols { display: flex; align-items: flex-end; gap: 10px; flex: 1 1 auto; min-height: 0; }
  .col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
  .col .c { width: 100%; border-radius: 4px 4px 0 0; }
  .col span { font-size: 13px; color: var(--sub); text-align: center; }
  .col b { font-size: 15px; white-space: nowrap; letter-spacing: -0.4px; }
  .cols.tight .col b { font-size: 13px; }
  /* 한눈에 보기: 지표 기둥 */
  .pillars { display: flex; gap: 18px; align-items: stretch; flex: 1 1 auto; min-height: 0; }
  .pillar { flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .ptrack { flex: 1 1 auto; background: var(--track); border-radius: 8px; position: relative; overflow: hidden; }
  .ptrack .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 8px 8px 0 0; }
  .ptrack .lbl { position: absolute; left: 0; right: 0; top: 10px; text-align: center; font-size: 26px; font-weight: 700; color: var(--navy); }
  .ptrack .lbl small { display: block; font-size: 14px; color: var(--sub); font-weight: 400; }
  .ptrack .g25 { position: absolute; left: 0; right: 0; border-top: 1px dashed #A9B6C8; }
  .pname { font-size: 15.5px; text-align: center; font-weight: 700; min-height: 44px; }
  .pfield { font-size: 13px; text-align: center; color: var(--sub); }
  /* 액자 */
  .frame { grid-template-columns: 1fr; place-items: center; text-align: center; }
  .fclock { font-size: 220px; font-weight: 700; color: var(--navy); letter-spacing: -4px; line-height: 1; }
  .fdate { font-size: 40px; color: var(--sub); margin-top: 12px; }
  .fcard { margin-top: 56px; min-width: 1100px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(20,30,50,.06); border: 1px solid var(--line); border-radius: 20px; padding: 36px 48px; }
  .fcard .k { font-size: 26px; color: var(--sub); }
  .fcard .val { font-size: 76px; font-weight: 700; color: var(--navy); margin-top: 8px; }
  .fcard .sub { font-size: 24px; color: var(--sub); margin-top: 6px; }
  .fslogan { margin-top: 40px; font-size: 30px; font-weight: 700; color: var(--navy); letter-spacing: 0.5px; }
  #stage.framemode { grid-template-rows: minmax(0, 1fr); }
  #stage.framemode header { display: none; }
  .help { position: absolute; right: 20px; bottom: 12px; font-size: 13px; color: #9AA6B6; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><img class="emblem" src="img/emblem.png" alt="동해시 상징마크"><span id="appTitle">동해시 AI 시장실</span><span id="appSlogan" class="slogan"></span></div>
    <nav id="nav" aria-label="화면 메뉴"></nav>
    <div class="hright"><span id="badges"></span><span id="updated"></span><span id="clock"></span></div>
  </header>
  <main id="view"></main>
</div>
<div class="help">← → 화면 넘김 · F 액자 · 숫자키 메뉴</div>
<script>
function startApp() {
  'use strict';
  var D = window.DONGHAE_DATA;
  var stage = document.getElementById('stage');
  var view = document.getElementById('view');

  // ---------- 화면 크기에 맞춰 1920×1080을 늘리거나 줄임 ----------
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(' + (window.innerWidth - 1920 * s) / 2 + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  // ---------- 작은 도우미 ----------
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'style') e.style.cssText = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function fmt(v, d) { return v == null ? '–' : Number(v).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function judgeLabel(j) { return { strong: '강점', weak: '개선 필요', middle: '중간', excluded: '판정 제외' }[j] || ''; }
  function judgeColor(j) { return { strong: '#2E9C6A', weak: '#D9822B', middle: '#6B8FBF', excluded: '#B3BDCB' }[j] || '#6B8FBF'; }
  function ind(id) { return (D.indicators || []).filter(function (i) { return i.id === id; })[0]; }
  function ymLabel(ym) { return ym ? ym.slice(0, 4) + '년 ' + Number(ym.slice(4)) + '월' : ''; }

  if (!D) {
    setTimeout(function () { location.reload(); }, 30 * 60 * 1000);
    view.appendChild(el('div', { class: 'empty', style: 'font-size:28px;padding:80px', text: '데이터 파일을 받지 못했습니다. 인터넷 연결을 확인해 주세요. 30분 뒤 자동으로 다시 시도합니다.' }));
    return;
  }

  document.getElementById('appTitle').textContent = D.title;
  document.getElementById('appSlogan').textContent = D.slogan || '';
  var badges = document.getElementById('badges');
  if (D.demo) badges.appendChild(el('span', { class: 'badge demo', text: '시연용 가짜 값' }));
  var gen = new Date(D.generated_at.replace(' ', 'T') + ':00+09:00');
  if ((Date.now() - gen.getTime()) > 36 * 3600 * 1000) badges.appendChild(el('span', { class: 'badge late', text: '갱신 지연' }));
  document.getElementById('updated').textContent = '최종 갱신 ' + D.generated_at;

  // ---------- 메뉴 ----------
  var nav = document.getElementById('nav');
  var order = D.menu.map(function (m) { return m.id; });
  var current = (location.hash || '#' + order[0]).slice(1);
  if (order.indexOf(current) < 0) current = order[0];
  D.menu.forEach(function (m, i) {
    nav.appendChild(el('button', { type: 'button', 'data-id': m.id, text: (i + 1) + ' ' + m.label, onclick: function () { go(m.id); } }));
  });

      k.appendChild(el('div', { class: 'kpi t-' + tone + (onOpen ? ' click' : ''), onclick: onOpen || null, role: onOpen ? 'button' : null, tabindex: onOpen ? '0' : null },
        [lab, el('div', { class: 'v' }, [v, el('small', { text: u })]),
        el('div', { class: 'chips' }, chips.filter(Boolean).map(function (c) { return el('span', { class: 'chip ' + (c[1] || ''), text: c[0] }); }))]));
    }
    var ACC = (F.accounts || {}), ay = Object.keys(ACC).sort().pop(), acc = ay ? ACC[ay] : {};
    var dep = sel.budget - (sel.own || 0), f1 = fiv(SN), pop = ((D.admin || {}).regions || {})[SN];
    var pm = pop && pop.total ? sel.budget / pop.total : null, pmMe = ((D.admin || {}).regions || {})[D.me] ? me.budget / D.admin.regions[D.me].total : null;
    var pmAll = names.map(function (n) { var r = ((D.admin || {}).regions || {})[n]; return r && r.total ? am[n].budget / r.total : null; }).filter(function (x) { return x != null; }).sort(function (x, y) { return y - x; });
    function rt(r, n) { var c = Math.ceil(n * (D.judge.strong_pct || 25) / 100); return r <= c ? 'good' : r > n - c ? 'bad' : 'navy'; }
    var rB = rk(rb, SN), rO = rk(ro, SN), rP = pm ? pmAll.indexOf(pm) + 1 : null;
    kpi('예산 규모', ly + ' 당초 · 일반회계', eok(sel.budget), '억 원', 'navy', [['도내 ' + rB + '위 / ' + rb.n, rt(rB, rb.n)],
      acc[SN] ? ['전체 ' + fmt(acc[SN].total / 100, 0) + '억', 'violet'] : null,
      diffMe != null ? ['동해보다 ' + (diffMe >= 0 ? '+' : '') + eok(diffMe) + '억', diffMe >= 0 ? 'good' : 'bad'] : null],
      acc[SN] ? function () { finDetail = 'accounts'; render(); } : null);
    kpi('자체수입', '지방세 + 세외수입', eok(sel.own), '억 원', 'good', [['도내 ' + rO + '위', rt(rO, ro.n)], ['예산의 ' + fmt(sel.own / sel.budget * 100, 1) + '%', 'violet']]);
    kpi('의존재원 등', '교부세·보조금 등', eok(dep), '억 원', 'mute', [['예산의 ' + fmt(dep / sel.budget * 100, 1) + '%', 'violet']]);
    kpi('재정자립도', '', f1 ? fmt(f1.value, 1) : '–', '%', f1 ? (f1.judge === 'strong' ? 'good' : f1.judge === 'weak' ? 'bad' : 'navy') : 'mute',
      [f1 ? ['도내 ' + f1.rank + '위 / ' + fi.n, rt(f1.rank, fi.n)] : null]);
    kpi('주민 1인당 예산', '', pm ? fmt(pm / 1e4, 0) : '–', '만 원', 'navy', [rP ? ['도내 ' + rP + '위', rt(rP, pmAll.length)] : null,
      pm && !isMe && pmMe ? ['동해 ' + fmt(pmMe / 1e4, 0) + '만 원', 'violet'] : null]);
    view.appendChild(k);

    function pick(n) { finSel = (n === finSel ? D.me : n); render(); }
    var hl = isMe ? null : SN;
    // 왼쪽: 예산 규모(가로 목록)
    var s1 = el('section', {}, [el('div', { class: 'sh' }, [el('h2', { text: '예산 규모' }), el('small', { text: ly + ' 당초 · 억 원' })])]);
    s1.appendChild(rankList(rb, pick, hl)); view.appendChild(s1);
    // 가운데: 자체수입(세로 막대)
    var s2 = el('section', {}, [el('div', { class: 'sh' }, [el('h2', { text: '자체수입' }), el('small', { text: '지방세 + 세외수입 · 억 원' })])]);
    s2.appendChild(colChart(names.map(function (n) { return [n, (am[n].own || 0) / 1e8]; }), pick, hl, 0));
    view.appendChild(s2);
    // 오른쪽: 예산 구성(원형) + 재정자립도(세로 막대)
    var s3 = el('section', { style: 'display:grid;grid-template-rows:auto minmax(0,0.9fr) auto minmax(0,1.1fr);gap:10px' }, [
      el('div', { class: 'sh' }, [el('h2', { text: '예산 구성 · ' + full }), el('small', { text: '억 원' })]),
      donut([['자체수입 ' + eok(sel.own) + '억', sel.own, '#2E9C6A'], ['의존재원 등 ' + eok(dep) + '억', dep, '#8FB2E0']], eok(sel.budget) + '억', '예산 규모'),
      el('div', { class: 'sh' }, [el('h2', { text: '재정자립도' }), el('small', { text: '높을수록 좋음 · %' })])
    ]);
    if (fi) s3.appendChild(colChart(fi.ranking.map(function (r) { return [r.name, r.value]; }), pick, hl, 1));
    else s3.appendChild(el('div', { class: 'empty', text: '자료 없음' }));
    view.appendChild(s3);

    // 세부 보기(팝업): 회계별 예산
    if (finDetail === 'accounts' && acc[SN]) {
      var A2 = acc[SN];
      function close() { finDetail = null; render(); }
      view.appendChild(el('div', { id: 'detailBack', onclick: close }));
      var tb = el('tbody');
      Object.keys(acc).map(function (n) { return [n, acc[n]]; }).sort(function (x, y) { return y[1].total - x[1].total; }).forEach(function (r, i) {
        var m = r[0] === D.me, p = r[0] === SN && !m;
        tb.appendChild(el('tr', { class: m ? 'me' : p ? 'pk' : '', style: 'cursor:pointer', onclick: function () { finSel = r[0]; render(); } },
          [String(i + 1), r[0], r[1].total, r[1].general, r[1].enterprise, r[1].other, r[1].fund].map(function (v, j) {
            return el('td', { class: j > 1 ? 'r' : '', text: j > 1 ? fmt(v / 100, 0) : v });
          })));
      });
      var tbl = el('table', { class: 'dt big' }, [el('thead', {}, [el('tr', {}, ['순위', '시·군', '전체(통합)', '일반회계', '공기업특별', '기타특별', '기금'].map(function (h, j) { return el('th', { class: j > 1 ? 'r' : '', text: h }); }))]), tb]);
      view.appendChild(el('section', { class: 'detail' }, [
        el('div', { class: 'sh' }, [el('h2', { text: ay + ' 당초예산 회계별 구성 · ' + full + ' 전체 ' + fmt(A2.total / 100, 0) + '억 원' }), el('small', { text: '통합회계 총계 · 억 원 · 표의 시·군을 누르면 바뀝니다' }),
          el('button', { class: 'zbtn', type: 'button', text: '✕ 닫기', onclick: close })]),
        el('div', { class: 'detailBody' }, [
          donut([['일반회계 ' + fmt(A2.general / 100, 0) + '억', A2.general, '#1F6FD1'], ['공기업특별회계 ' + fmt(A2.enterprise / 100, 0) + '억', A2.enterprise, '#2E9C6A'],
                 ['기타특별회계 ' + fmt(A2.other / 100, 0) + '억', A2.other, '#E8A867'], ['기금 ' + fmt(A2.fund / 100, 0) + '억', A2.fund, '#8FB2E0']], fmt(A2.total / 100, 0) + '억', '전체 예산'),
          el('div', { style: 'min-height:0;overflow:auto' }, [tbl])])
      ]));
    }
  }

  // ---------- 4. 액자 ----------
  var frameIdx = 0, frameTimer = null;
  function frameCards() {
    var cards = [];
    var A = D.admin;
    if (A && A.regions[D.me]) {
      var m = A.regions[D.me];
      var dmm = m.prev_m ? m.total - m.prev_m : null;
      cards.push({ k: D.me + '시 인구', v: fmt(m.total, 0) + '명', s: ymLabel(A.ym) + ' 주민등록 기준' + (dmm != null ? ' · 지난달보다 ' + (dmm >= 0 ? '+' : '') + fmt(dmm, 0) + '명' : '') + ' · ' + fmt(m.hh, 0) + '세대' });
    }
    D.indicators.forEach(function (i) {
      if (i.main !== false && i.id !== 'budget' && i.me && i.me.judge === 'strong') cards.push({ k: '강원 18개 시·군 중', v: i.name + ' ' + i.me.rank + '위', s: fmt(i.me.value, i.digits) + i.unit + ' · ' + i.basis });
    });
    var f = ind('budget');
    if (f && f.me) cards.push({ k: D.me + '시 예산', v: fmt(f.me.value, 0) + '억 원', s: f.basis + ' · 도내 ' + f.me.rank + '위' });
    return cards.length ? cards : [{ k: D.title, v: D.me + '시', s: '' }];
  }
  function screenFrame() {
    view.className = 'frame';
    view.style.gridTemplateColumns = '1fr';
    view.style.gridTemplateRows = '1fr';
    var cards = frameCards();
    var c = cards[frameIdx % cards.length];
    var now = new Date();
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    view.appendChild(el('div', {}, [
      el('div', { class: 'fclock', id: 'fclock', text: now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }) }),
      el('div', { class: 'fdate', text: now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + days[now.getDay()] + '요일' }),
      el('div', { class: 'fcard' }, [el('div', { class: 'k', text: c.k }), el('div', { class: 'val', text: c.v }), el('div', { class: 'sub', text: c.s })]),
      el('div', { class: 'fslogan', text: (D.frame && D.frame.slogan) || '' })
    ]));
    clearTimeout(frameTimer);
    frameTimer = setTimeout(function () { frameIdx++; if (current === 'frame') render(); }, ((D.frame && D.frame.rotate_sec) || 20) * 1000);
  }

  // ---------- 그리기 ----------
  var SCREENS = { main: screenMain, admin: screenAdminTabs, finance: screenFinance, frame: screenFrame };
  function render() {
    view.textContent = '';
    view.className = '';
    stage.className = current === 'frame' ? 'framemode' : '';
    Array.prototype.forEach.call(nav.children, function (b) {
      if (b.getAttribute('data-id') === current) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    try { (SCREENS[current] || screenMain)(); }
    catch (e) { view.textContent = ''; view.appendChild(el('div', { class: 'empty', style: 'font-size:24px;padding:60px', text: '이 화면을 그리지 못했습니다: ' + e.message })); }
    addZoom();
  }

  // ---------- 크게 보기: 각 칸 제목 오른쪽 버튼, 다시 누르거나 Esc로 닫기 ----------
  var zoomIdx = null;
  function addZoom() {
    var old = document.getElementById('zoomBack'); if (old) old.remove();
    var secs = view.querySelectorAll('section:not(.detail)');
    Array.prototype.forEach.call(secs, function (sec, idx) {
      var sh = sec.querySelector('.sh'); if (!sh) return;
      var on = zoomIdx === idx;
      sh.appendChild(el('button', { class: 'zbtn', type: 'button', text: on ? '✕ 닫기' : '⤢ 크게 보기',
        onclick: function (ev) { ev.stopPropagation(); zoomIdx = on ? null : idx; render(); } }));
      if (on) {
        sec.classList.add('zoom');
        var back = el('div', { id: 'zoomBack', onclick: function () { zoomIdx = null; render(); } });
        view.appendChild(back);
      }
    });
    if (zoomIdx != null && !view.querySelector('section.zoom')) zoomIdx = null;
  }

  // ---------- 리모컨(무선 키보드) ----------
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (zoomIdx != null || finDetail || admDetail)) { zoomIdx = null; finDetail = null; admDetail = null; render(); return; }
    var i = order.indexOf(current);
    if (e.key === 'ArrowRight') go(order[(i + 1) % order.length]);
    else if (e.key === 'ArrowLeft') go(order[(i - 1 + order.length) % order.length]);
    else if (e.key === 'f' || e.key === 'F') { if (order.indexOf('frame') >= 0) go('frame'); }
    else if (/^[1-9]$/.test(e.key) && order[Number(e.key) - 1]) go(order[Number(e.key) - 1]);
  });

  // ---------- 시계, 자동 새로고침 ----------
  function tick() {
    var t = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    document.getElementById('clock').textContent = t;
    var fc = document.getElementById('fclock'); if (fc) fc.textContent = t;
  }
  setInterval(tick, 10000); tick();
  // 30분마다 새 데이터 파일을 다시 읽습니다(지금 보고 있던 화면 유지).
  setTimeout(function () { location.reload(); }, 30 * 60 * 1000);

  render();
}

// 데이터 파일은 매번 새로 받습니다(주소 뒤 ?t=…로 브라우저 캐시를 피함). 못 받으면 오프라인 캐시를 씁니다.
(function () {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  var s = document.createElement('script');
  s.src = 'data/data.js?t=' + Date.now();
  s.onload = startApp;
  s.onerror = startApp;
  document.head.appendChild(s);
})();
</script>
