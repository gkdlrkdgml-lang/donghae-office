name: Supabase 표 만들기(SQL 실행)

on:
  workflow_dispatch:
    inputs:
      file:
        description: '실행할 SQL 파일(supabase/ 아래)'
        required: true
        default: 'sites.sql'

jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SQL 실행
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FILE: ${{ inputs.file }}
        run: |
          case "$FILE" in *..*|/*) echo "잘못된 파일"; exit 1;; esac
          body=$(python3 -c "import json,sys; print(json.dumps({'query': open('supabase/'+sys.argv[1], encoding='utf-8').read()}))" "$FILE")
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/zkdsystvrakicrkckcrd/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
          echo "응답 $code: $(head -c 600 /tmp/r.txt)"
          [ "$code" -lt 300 ]
