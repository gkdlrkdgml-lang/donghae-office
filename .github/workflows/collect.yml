name: 매일 수집 · 화면 갱신

on:
  schedule:
    - cron: '7 21 * * *'   # 매일 06:07 (한국시간). 정각은 GitHub이 붐벼서 7분 뒤로.
    - cron: '47 23,2,5,8,11 * * *'   # 날씨·혼잡 예측 갱신: 08:47, 11:47, 14:47, 17:47, 20:47
    - cron: '17 18 * * 0'   # 매주 월요일 03:17(한국시간): 캐시 무시하고 모든 API 다시 호출(새로 올라온 자료 놓치지 않게)
  workflow_dispatch:        # Actions 탭에서 "Run workflow"로 바로 실행
    inputs:
      mode:
        description: 'full = 전체 수집, admin = 관리자 입력만 반영(1~2분), force = 캐시 무시하고 모든 API 다시 호출'
        required: false
        default: 'full'

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  gate:   # GitHub 예약이 늦게 와서, Supabase 예약으로 이미 돈 직후라면 한 번 건너뜀
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=yes
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "17 18 * * 0" ]; then
            n=$(gh run list -R ${{ github.repository }} -w collect.yml -L 20 --json conclusion,status,createdAt,updatedAt,databaseId -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status==\"in_progress\" or .status==\"queued\" or (.conclusion==\"success\" and ((.updatedAt|fromdate)-(.createdAt|fromdate)) > 360 and (now - (.createdAt|fromdate)) < 9000))] | length")
            [ "$n" != "0" ] && go=no && echo "최근 2시간 반 안에 수집이 이미 돌았거나 도는 중이라 건너뜁니다"
          fi
          echo "go=$go" >> $GITHUB_OUTPUT
  collect:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q xlrd==2.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 수집·계산
        env:
          TZ: Asia/Seoul
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          LOFIN_KEY: ${{ secrets.LOFIN_KEY }}
          LOFIN_KEY_FINAL: ${{ secrets.LOFIN_KEY_FINAL }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
          KEPCO_KEY: ${{ secrets.KEPCO_KEY }}
          SAFETY_DATA_KEY: ${{ secrets.SAFETY_DATA_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC: ${{ secrets.LAW_OC }}
          NCPMS_KEY: ${{ secrets.NCPMS_KEY }}
        run: |
          set -e
          # 전체 잠금: 수집 캐시는 Supabase 비공개 저장소에서 받아 옴(없으면 저장소에 남은 파일)
          python collect/store.py pull
          # 키를 아직 안 넣었으면 시연용 값으로 화면만 띄웁니다(키를 넣으면 자동으로 실제 수집).
          if [ "${{ inputs.mode }}" = "admin" ]; then python collect/run.py --admin-only
          elif [ -z "$DATA_GO_KR_KEY" ]; then python collect/run.py --demo
          elif [ "${{ inputs.mode }}" = "force" ] || [ "${{ github.event.schedule }}" = "17 18 * * 0" ]; then python collect/run.py --force-all --force-life --force-agri --force-attr --force-stores --force-water --force-wipan --force-ncpms --force-power
          else python collect/run.py; fi
          if [ "${{ inputs.mode }}" != "admin" ]; then python collect/tiles.py || true; fi
          # 수집 캐시·화면 자료는 Supabase 비공개 저장소에만 올림(GitHub에는 올리지 않음)
          python collect/store.py push
      - name: 자동 갱신 점검(오래 실패한 자료가 있으면 이슈로 알림)
        if: ${{ inputs.mode != 'admin' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Seoul
        run: python3 collect/health.py || true
      - name: 결과 저장(지도 타일만 커밋)
        run: |
          git config user.name "donghae-office-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- web/data 2>/dev/null || true   # 자료는 이미 Supabase에 올림(GitHub에는 안 올림)
          git add web/img/tiles
          git diff --cached --quiet || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # GitHub은 60일 동안 커밋이 없으면 예약 실행을 멈춤 → 30일 넘으면 표시 파일 하나 갱신
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then date -u +%FT%TZ > .keepalive; git add .keepalive; git commit -m "예약 실행 유지"; fi
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs || true; sleep 5; done
      - name: 공개 사이트에서 자료 파일 빼기(자료는 로그인 후 Supabase에서 받음)
        run: rm -rf web/data web/landtest.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
