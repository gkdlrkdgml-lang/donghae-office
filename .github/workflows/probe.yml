name: API 점검(키 넣은 뒤 한 번)

on:
  workflow_dispatch:
    inputs:
      only:
        description: '일부만 점검(kepco 등)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 각 API 한 번씩 호출
        env:
          TZ: Asia/Seoul
          PROBE_ONLY: ${{ inputs.only }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          LOFIN_KEY: ${{ secrets.LOFIN_KEY }}
          LOFIN_KEY_FINAL: ${{ secrets.LOFIN_KEY_FINAL }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
          KEPCO_KEY: ${{ secrets.KEPCO_KEY }}
          SAFETY_DATA_KEY: ${{ secrets.SAFETY_DATA_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python collect/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe_결과.txt
          if-no-files-found: ignore
