name: Supabase 중계 기능 올리기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zkdsystvrakicrkckcrd
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.62.10
      - name: 비밀값 넣기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" DATA_GO_KR_KEY="$DATA_GO_KR_KEY"
          if [ -n "$GH_DISPATCH_TOKEN" ]; then supabase secrets set --project-ref "$PROJECT_REF" GH_DISPATCH_TOKEN="$GH_DISPATCH_TOKEN"; else echo "GH_DISPATCH_TOKEN 없음 — 저장 즉시 반영은 꺼진 상태"; fi
      - name: 함수 올리기
        run: |
          supabase functions deploy land --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy kr --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy rebuild --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: 올라갔는지 확인(로그인 없이 부르면 401이 정상)
        run: |
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/land" -H 'content-type: application/json' -d '{"pnu":"5117010100108060000"}')
          echo "응답 $code: $(cat /tmp/r.txt)"
